kind = "web"
previewPath = "/"
title = "Pista Secreta"
version = "1.0.0"
id = "artifacts/pista-secreta"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23677

[services.development]
run = "pnpm --filter @workspace/pista-secreta run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pista-secreta", "run", "build" ]
publicDir = "artifacts/pista-secreta/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/upsell"
to = "/upsell/index.html"

[[services.production.rewrites]]
from = "/upsell/"
to = "/upsell/index.html"

[[services.production.rewrites]]
from = "/upsell2"
to = "/upsell2/index.html"

[[services.production.rewrites]]
from = "/upsell2/"
to = "/upsell2/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23677"
BASE_PATH = "/"
