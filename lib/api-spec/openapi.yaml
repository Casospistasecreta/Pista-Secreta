openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analytics
    description: Landing page analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analytics/purchase-click:
    post:
      operationId: trackPurchaseClick
      tags: [analytics]
      summary: Track purchase button click
      description: Records a click on the purchase call-to-action.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackPurchaseClickRequest"
      responses:
        "200":
          description: Click tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackPurchaseClickResponse"
  /analytics/purchase-clicks:
    get:
      operationId: getPurchaseClickStats
      tags: [analytics]
      summary: Get purchase click stats
      description: Returns the total number of tracked purchase clicks.
      responses:
        "200":
          description: Purchase click stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseClickStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TrackPurchaseClickRequest:
      type: object
      properties:
        destination:
          type: string
    TrackPurchaseClickResponse:
      type: object
      properties:
        success:
          type: boolean
        totalClicks:
          type: integer
      required:
        - success
        - totalClicks
    PurchaseClickStats:
      type: object
      properties:
        totalClicks:
          type: integer
      required:
        - totalClicks

