name: Dependency audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (high/critical)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fail on high or critical dependency vulnerabilities
        run: pnpm run security:audit
